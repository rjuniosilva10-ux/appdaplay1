function startExpandedViz() {
    const canvas = $('expandedViz');
    if (!canvas || !analyser) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.clientWidth || 400, H = canvas.clientHeight || 80;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.scale(dpr, dpr);
    function draw() {
        if (!analyser) return;
        const data = new Uint8Array(analyser.frequencyBinCount);
        analyser.getByteFrequencyData(data);
        ctx.clearRect(0, 0, W, H);
        const bars = 48;
        const step = Math.floor(data.length / bars);
        const barW = W / bars;
        for (let i = 0; i < bars; i++) {
            const v = data[i * step] / 255;
            const h = 4 + v * (H - 8);
            const x = i * barW;
            const y = H - h;
            const grad = ctx.createLinearGradient(0, y, 0, H);
            grad.addColorStop(0, 'rgba(29,185,84,1)');
            grad.addColorStop(1, 'rgba(94,234,212,.4)');
            ctx.fillStyle = grad;
            ctx.fillRect(x + 1, y, barW - 2, h);
        }
        expandedVizRAF = requestAnimationFrame(draw);
    }
    draw();
}

        }
        updateSleepUI();
        $('sleepMenu').classList.remove('active');
    });
});
document.addEventListener('click', (e) => {
    const menu = $('sleepMenu');
    if (menu && menu.classList.contains('active') && !menu.contains(e.target) && e.target.id !== 'sleepBtn') {
        menu.classList.remove('active');
    }
});

/* NOTAS */
async function loadNotas() {
    try {
        allNotas = await notasDbGetAll();
        allNotas.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    } catch (e) { console.error('Erro ao carregar notas:', e); allNotas = []; }
    renderNotas();
}
function renderNotas() {
    const grid = $('notasGrid');
    if (!grid) return;
    const q = ($('notasSearch')?.value || '').toLowerCase().trim();
    const filtradas = q
        ? allNotas.filter(n => (n.titulo || '').toLowerCase().includes(q) || (n.texto || '').toLowerCase().includes(q))
        : allNotas;
    if (!filtradas.length) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="emoji">📝</div><p>${q ? 'Nenhuma nota encontrada.' : 'Nenhuma nota ainda.<br>Toque em <b>+ Nova Nota</b> para começar.'}</p></div>`;
        return;
    }
    grid.innerHTML = filtradas.map(n => {
        const nFotos = (n.fotos || []).length;
        const nLinks = (n.links || []).length;
        const nAudios = (n.audios || []).length;
        const preview = (n.texto || '').replace(/\n/g, ' ').slice(0, 120);
        const dataFmt = n.updatedAt ? new Date(n.updatedAt).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : '';
        const badges = [
            nFotos ? `<span class="nota-card-badge">📷 ${nFotos}</span>` : '',
            nLinks ? `<span class="nota-card-badge">🔗 ${nLinks}</span>` : '',
            nAudios ? `<span class="nota-card-badge">🎙️ ${nAudios}</span>` : ''
        ].filter(Boolean).join('');
        return `
            <div class="nota-card" data-nota-id="${escapeHtml(n.id)}">
                <button class="nota-card-del" data-action="notadel" aria-label="Excluir">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                </button>
                <div class="nota-card-title">${escapeHtml(n.titulo || 'Sem título')}</div>
                <div class="nota-card-preview">${escapeHtml(preview) || '<i>(sem texto)</i>'}</div>
                <div class="nota-card-meta">
                    ${badges || '<span>📄 vazia</span>'}
                    <span style="margin-left:auto">${dataFmt}</span>
                </div>
            </div>
        `;
    }).join('');
    grid.querySelectorAll('.nota-card').forEach(card => {
        card.addEventListener('click', e => {
            const del = e.target.closest('[data-action="notadel"]');
            if (del) { e.stopPropagation(); excluirNota(card.dataset.notaId); return; }
            abrirNota(card.dataset.notaId);
        });
    });
}
async function excluirNota(id) {
    if (!confirm('Excluir esta nota permanentemente?')) return;
    try {
        await notasDbDelete(id);
        allNotas = allNotas.filter(n => n.id !== id);
        renderNotas();
        toast('Nota excluída!', 'success');
    } catch (err) { console.error('Erro ao excluir nota:', err); toast('Erro ao excluir: ' + (err.message || 'desconhecido'), 'error'); }
}
function openNotaEditor(nota) {
    editingNota = nota ? JSON.parse(JSON.stringify(nota)) : {
        id: 'nota_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
        titulo: '', texto: '', fotos: [], links: [], audios: [],
        createdAt: Date.now(), updatedAt: Date.now()
    };
    $('notaTitulo').value = editingNota.titulo || '';
    $('notaTexto').value = editingNota.texto || '';
    renderNotaAnexos();
    $('notaEditorOverlay').classList.add('active');
    setTimeout(() => $('notaTitulo').focus(), 100);
}
function abrirNota(id) {
    const nota = allNotas.find(n => n.id === id);
    if (nota) openNotaEditor(nota);
}
function closeNotaEditor() {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
        if (!confirm('Gravação em andamento será perdida. Fechar mesmo assim?')) return;
        pararGravacao(true);
    }
    $('notaEditorOverlay').classList.remove('active');
    editingNota = null;
}
function renderNotaAnexos() {
    if (!editingNota) return;
    $('notaFotos').innerHTML = (editingNota.fotos || []).map((src, i) => `
        <div class="nota-foto">
            <img src="${src}" alt="">
            <button class="nota-foto-del" onclick="removerFotoNota(${i})" aria-label="Remover foto">✕</button>
        </div>
    `).join('');
    $('notaLinks').innerHTML = (editingNota.links || []).map((url, i) => `
        <div class="nota-link-item">
            <a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
            <button class="nota-link-del" onclick="removerLinkNota(${i})" aria-label="Remover link">✕</button>
        </div>
    `).join('');
    $('notaAudios').innerHTML = (editingNota.audios || []).map((src, i) => `
        <div class="nota-audio-item">
            <audio controls src="${src}"></audio>
            <button class="nota-audio-del" onclick="removerAudioNota(${i})" aria-label="Remover áudio">✕</button>
        </div>
    `).join('');
}
async function handleNotaFotos(event) {
    const files = Array.from(event.target.files);
    if (!files.length || !editingNota) return;
    toast(`Processando ${files.length} foto(s)...`);
    for (const file of files) {
        try {
            const dataUrl = await compressImage(file, 1080, 0.8);
            editingNota.fotos = editingNota.fotos || [];
            editingNota.fotos.push(dataUrl);
        } catch (e) { console.error(e); }
    }
    renderNotaAnexos();
    event.target.value = '';
    toast('Fotos adicionadas', 'success');
}
function compressImage(file, maxSize, quality) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
            const img = new Image();
            img.onload = () => {
                let w = img.width, h = img.height;
                if (w > maxSize || h > maxSize) {
                    if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
                    else { w = Math.round(w * maxSize / h); h = maxSize; }
                }
                const canvas = document.createElement('canvas');
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = reject;
            img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}
function removerFotoNota(i) { editingNota.fotos.splice(i, 1); renderNotaAnexos(); }
function addNotaLink() {
    if (!editingNota) return;
    let url = prompt('Cole a URL do link (ex: https://exemplo.com):');
    if (!url) return;
    url = url.trim();
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    try { new URL(url); } catch { toast('URL inválida', 'error'); return; }
    editingNota.links = editingNota.links || [];
    editingNota.links.push(url);
    renderNotaAnexos();
}
function removerLinkNota(i) { editingNota.links.splice(i, 1); renderNotaAnexos(); }
function removerAudioNota(i) { editingNota.audios.splice(i, 1); renderNotaAnexos(); }
async function toggleNotaGravacao() {
    if (!editingNota) return;
    if (mediaRecorder && mediaRecorder.state === 'recording') { pararGravacao(false); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder) {
        toast('Gravação de áudio não suportada', 'error'); return;
    }
    try {
        recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
        mediaRecorder = new MediaRecorder(recStream, mimeType ? { mimeType } : undefined);
        recordedChunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            if (recordedChunks.length) {
                const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                const reader = new FileReader();
                reader.onload = () => {
                    editingNota.audios = editingNota.audios || [];
                    editingNota.audios.push(reader.result);
                    renderNotaAnexos();
                    toast('Áudio gravado!', 'success');
                };
                reader.readAsDataURL(blob);
            }
            if (recStream) { recStream.getTracks().forEach(t => t.stop()); recStream = null; }
            recordedChunks = [];
        };
        mediaRecorder.start();
        $('btnRecAudio').classList.add('recording');
        $('btnRecAudio').textContent = '⏹️ Parar gravação';
        recTimeoutId = setTimeout(() => { if (mediaRecorder.state === 'recording') pararGravacao(false); }, 5 * 60 * 1000);
    } catch (e) { console.error(e); toast('Não foi possível acessar o microfone', 'error'); }
}
function pararGravacao(silent) {
    if (recTimeoutId) { clearTimeout(recTimeoutId); recTimeoutId = null; }
    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    $('btnRecAudio').classList.remove('recording');
    $('btnRecAudio').textContent = '🎙️ Gravar áudio';
    if (silent && recStream) { recStream.getTracks().forEach(t => t.stop()); recStream = null; }
}
async function saveNota() {
    if (!editingNota) { toast('Nenhuma nota aberta', 'error'); return; }
    const titulo = ($('notaTitulo').value || '').trim();
    const texto = $('notaTexto').value || '';
    const temFotos = (editingNota.fotos || []).length > 0;
    const temLinks = (editingNota.links || []).length > 0;
    const temAudios = (editingNota.audios || []).length > 0;
    if (!titulo && !texto.trim() && !temFotos && !temLinks && !temAudios) {
        toast('Preencha o título ou o texto antes de salvar', 'error'); return;
    }
    editingNota.titulo = titulo || ('Nota ' + new Date().toLocaleString('pt-BR'));
    editingNota.texto = texto;
    editingNota.updatedAt = Date.now();
    if (!editingNota.createdAt) editingNota.createdAt = Date.now();
    try {
        await notasDbPut(editingNota);
        const idx = allNotas.findIndex(n => n.id === editingNota.id);
        if (idx >= 0) allNotas[idx] = editingNota;
        else allNotas.unshift(editingNota);
        allNotas.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        renderNotas();
        toast('Nota salva com sucesso!', 'success');
        $('notaEditorOverlay').classList.remove('active');
        editingNota = null;
    } catch (err) { console.error('Erro ao salvar nota:', err); toast('Erro ao salvar: ' + (err.message || 'desconhecido'), 'error'); }
}

/* PALETTE */
let paletteSelected = 0;
let paletteItems = [];
function openPalette() {
    $('paletteOverlay').classList.add('active');
    $('paletteInput').value = '';
    $('paletteInput').focus();
    buildPalette('');
}
function closePalette() {
    $('paletteOverlay').classList.remove('active');
    paletteSelected = 0;
}
function buildPalette(query) {
    const q = query.toLowerCase().trim();
    paletteItems = [];
    const actions = [
        { type: 'action', icon: '🎵', title: 'Ir para Músicas', sub: 'Navegar', run: () => clickNav('musicas') },
        { type: 'action', icon: '💚', title: 'Ir para Favoritas', sub: 'Navegar', run: () => clickNav('favoritas') },
        { type: 'action', icon: '📖', title: 'Ir para Bíblia', sub: 'Navegar', run: () => clickNav('biblia') },
        { type: 'action', icon: '📺', title: 'Ir para YouTube', sub: 'Navegar', run: () => clickNav('youtube') },
        { type: 'action', icon: '📝', title: 'Ir para Notas', sub: 'Navegar', run: () => clickNav('notas') },
        { type: 'action', icon: '➕', title: 'Nova Nota', sub: 'Notas', run: () => { clickNav('notas'); openNotaEditor(); } },
        { type: 'action', icon: '▶️', title: 'Play/Pause', sub: 'Controle', run: () => togglePlay() },
        { type: 'action', icon: '⏭️', title: 'Próxima faixa', sub: 'Controle', run: () => nextSong(false) },
        { type: 'action', icon: '⏮️', title: 'Faixa anterior', sub: 'Controle', run: () => prevSong() },
        { type: 'action', icon: '🌗', title: 'Alternar tema', sub: 'Aparência', run: () => toggleTheme() }
    ];
    actions.filter(a => !q || a.title.toLowerCase().includes(q) || a.sub.toLowerCase().includes(q))
        .forEach(a => paletteItems.push(a));
    allSongs.filter(s => !q || s.title.toLowerCase().includes(q) || (s.artist||'').toLowerCase().includes(q))
        .slice(0, 20)
        .forEach(s => paletteItems.push({
            type: 'song', icon: s.cover ? `<img src="${escapeHtml(s.cover)}" alt="">` : '🎵',
            title: s.title, sub: s.artist || 'Desconhecido',
            run: () => { playSong(s.id); closePalette(); }
        }));
    paletteSelected = 0;
    renderPalette();
}
function renderPalette() {
    const results = $('paletteResults');
    if (!paletteItems.length) {
        results.innerHTML = `<div class="palette-empty"><span class="emoji">🔍</span>Nada encontrado.</div>`;
        return;
    }
    results.innerHTML = paletteItems.map((it, i) => `
        <div class="palette-item ${i === paletteSelected ? 'selected' : ''}" data-index="${i}">
            <div class="palette-item-icon">${it.icon}</div>
            <div class="palette-item-content">
                <div class="palette-item-title">${escapeHtml(it.title)}</div>
                <div class="palette-item-sub">${escapeHtml(it.sub || '')}</div>
            </div>
            <span class="palette-item-hint">↵</span>
        </div>
    `).join('');
    results.querySelectorAll('.palette-item').forEach(el => {
        el.addEventListener('click', () => {
            const it = paletteItems[parseInt(el.dataset.index)];
            if (it) it.run();
        });
        el.addEventListener('mouseenter', () => {
            paletteSelected = parseInt(el.dataset.index);
            results.querySelectorAll('.palette-item').forEach(x => x.classList.remove('selected'));
            el.classList.add('selected');
        });
    });
}
function clickNav(view) {
    const el = document.querySelector(`.nav-item[data-view="${view}"]`);
    if (el) el.click();
}
function setupPaletteEvents() {
    const input = $('paletteInput');
    input.addEventListener('input', () => buildPalette(input.value));
    input.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            paletteSelected = Math.min(paletteSelected + 1, paletteItems.length - 1);
            renderPalette();
            document.querySelector('.palette-item.selected')?.scrollIntoView({ block: 'nearest' });
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            paletteSelected = Math.max(paletteSelected - 1, 0);
            renderPalette();
            document.querySelector('.palette-item.selected')?.scrollIntoView({ block: 'nearest' });
        } else if (e.key === 'Enter') {
            e.preventDefault();
            paletteItems[paletteSelected]?.run();
        } else if (e.key === 'Escape') closePalette();
    });
}

function setupKeyboardShortcuts() {
    document.addEventListener('keydown', (e) => {
        const tag = (e.target.tagName || '').toLowerCase();
        const isInput = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
        if (isInput) return;
        if (e.key === 'Escape') { closePalette(); closeExpanded(); closeYtPlayer(); closeNotaEditor(); return; }
        if (e.code === 'Space') { e.preventDefault(); togglePlay(); return; }
        if (e.key === 'ArrowRight' && audio.duration) { audio.currentTime = Math.min(audio.duration, audio.currentTime + 5); }
        if (e.key === 'ArrowLeft' && audio.duration) { audio.currentTime = Math.max(0, audio.currentTime - 5); }
        if (e.key.toLowerCase() === 'm') toggleMute();
        if (e.key === '1') clickNav('musicas');
        if (e.key === '2') clickNav('favoritas');
        if (e.key === '3') clickNav('biblia');
        if (e.key === '4') clickNav('youtube');
        if (e.key === '5') clickNav('notas');
    });
}
function setupExpandedEvents() {
    const exp = $('expandedPlayer');
    if (exp) exp.addEventListener('click', (e) => { if (e.target === exp) closeExpanded(); });
}

function initApp() {
    try {
        const favStr = localStorage.getItem('dauplay_favs');
        if (favStr) favorites = new Set(JSON.parse(favStr));
        const recStr = localStorage.getItem('dauplay_recent');
        if (recStr) recentTracks = JSON.parse(recStr) || [];
        if (localStorage.getItem('dauplay_theme') === 'light') {
            document.body.classList.add('light-mode');
            $('themeToggle').textContent = '🌙 Tema Escuro';
            $('themeToggleMobile').textContent = '🌙';
        }
    } catch {}
    loadSongs();
    loadNotas();
    initVolume();
    setupProgressBar();
    setupGridDelegation($('musicGrid'));
    setupGridDelegation($('favGrid'));
    setupKeyboardShortcuts();
    setupExpandedEvents();
    setupPaletteEvents();
    const ytIn = $('ytInput');
    if (ytIn) ytIn.addEventListener('keydown', e => { if (e.key === 'Enter') addYoutubeLink(); });
    const notasSearch = $('notasSearch');
    if (notasSearch) notasSearch.addEventListener('input', renderNotas);
    renderYoutube();
    updateSleepUI();
    const fab = $('fabAdd');
    if (fab) fab.style.display = 'flex';
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initApp);
else initApp();
</script>
