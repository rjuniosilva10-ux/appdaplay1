<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Dauplay — Sua Música, Sua Fé. Player, Bíblia offline com voz, YouTube e Notas.">
<meta name="theme-color" content="#06060a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dauplay">
<meta name="mobile-web-app-capable" content="yes">
<title>Dauplay — Sua Música, Sua Fé.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2306060a'/%3E%3Ctext x='50' y='68' font-size='58' text-anchor='middle' fill='%231DB954' font-weight='900' font-family='Arial'%3ED%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
    --bg-base:#06060a;
    --bg-elev:#0c0c14;
    --bg-glass:rgba(15,15,22,.65);
    --bg-glass-strong:rgba(18,18,26,.85);
    --bg-card:rgba(255,255,255,.03);
    --bg-card-hover:rgba(255,255,255,.06);
    --border-glass:rgba(255,255,255,.07);
    --border-light:rgba(255,255,255,.12);
    --text-main:#fff;
    --text-muted:#8a8a99;
    --text-dim:#5a5a6b;

    --dyn: 29,185,84;
    --dyn-2: 94,234,212;
    --accent:rgb(var(--dyn));
    --accent-2:rgb(var(--dyn-2));
    --accent-glow:rgba(var(--dyn),.4);
    --gradient-1:linear-gradient(135deg, #1DB954 0%, #5EEAD4 100%);

    --shadow-card:0 24px 48px -16px rgba(0,0,0,.9);
    --shadow-glow:0 0 40px -8px rgba(29,185,84,.45);

    --player-height:88px;
    --radius:20px;
    --radius-sm:14px;
    --radius-lg:28px;

    --ease-spring:cubic-bezier(.34,1.56,.64,1);
    --ease-smooth:cubic-bezier(.4,0,.2,1);

    --sidebar-w:248px;
}

body.light-mode{
    --bg-base:#f4f5f9;
    --bg-elev:#fff;
    --bg-glass:rgba(255,255,255,.75);
    --bg-glass-strong:rgba(255,255,255,.92);
    --bg-card:rgba(0,0,0,.03);
    --bg-card-hover:rgba(0,0,0,.06);
    --border-glass:rgba(0,0,0,.07);
    --border-light:rgba(0,0,0,.12);
    --text-main:#0a0a15;
    --text-muted:#5a5a6b;
    --text-dim:#9090a0;
    --shadow-card:0 24px 48px -16px rgba(30,30,60,.15);
}

html,body{height:100%}
body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg-base);
    color:var(--text-main);
    display:flex;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    transition:background .5s var(--ease-smooth),color .3s;
    position:relative;
}

body::before,
body::after{
    content:'';
    position:fixed;
    inset:-20%;
    pointer-events:none;
    z-index:0;
    transition:opacity .6s;
}
body::before{
    background:
        radial-gradient(ellipse at 15% 25%, rgba(29,185,84,.22) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 75%, rgba(94,234,212,.18) 0%, transparent 45%),
        radial-gradient(ellipse at 50% 50%, rgba(0,212,170,.08) 0%, transparent 55%);
    animation:auroraShift 24s ease-in-out infinite;
    filter:blur(20px);
}
body::after{
    background:
        radial-gradient(ellipse at 80% 20%, rgba(94,234,212,.10) 0%, transparent 40%),
        radial-gradient(ellipse at 20% 80%, rgba(29,185,84,.10) 0%, transparent 40%);
    animation:auroraShift 30s ease-in-out infinite reverse;
    filter:blur(40px);
}
body.light-mode::before{opacity:.35}
body.light-mode::after{opacity:.25}

@keyframes auroraShift{
    0%,100%{transform:translate(0,0) scale(1)}
    33%{transform:translate(3%,-2%) scale(1.08)}
    66%{transform:translate(-2%,3%) scale(1.04)}
}

#splashScreen{
    position:fixed;inset:0;background:#06060a;z-index:99999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity .7s var(--ease-smooth), transform .7s;
}
#splashScreen.fade-out{opacity:0;transform:scale(1.1);pointer-events:none}
.splash-content{animation:splashIn .8s var(--ease-spring) both;position:relative;}
.splash-content::before{
    content:'';position:absolute;inset:-40px;
    background:radial-gradient(circle, rgba(29,185,84,.35), transparent 65%);
    filter:blur(30px);animation:pulseGlow 2.5s ease-in-out infinite;
    z-index:-1;
}
@keyframes pulseGlow{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.2);opacity:1}}
@keyframes splashIn{from{opacity:0;transform:scale(.7) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.splash-img,#splashSvg{
    width:160px;height:160px;border-radius:36px;
    box-shadow:0 24px 80px rgba(29,185,84,.5), 0 0 0 1px rgba(255,255,255,.08);
    object-fit:cover;display:block;
}
.splash-loader{
    margin-top:48px;width:140px;height:3px;
    background:rgba(255,255,255,.08);border-radius:99px;
    overflow:hidden;position:relative;
}
.splash-bar{
    position:absolute;left:-50%;width:50%;height:100%;
    background:linear-gradient(90deg, transparent, #1db954, #5eead4, transparent);
    border-radius:99px;
    animation:loadBar 1.4s cubic-bezier(.65,.05,.36,1) infinite;
}
@keyframes loadBar{0%{left:-50%}100%{left:100%}}

.sidebar{
    width:var(--sidebar-w);
    background:var(--bg-glass);
    backdrop-filter:blur(32px) saturate(1.4);
    -webkit-backdrop-filter:blur(32px) saturate(1.4);
    border-right:1px solid var(--border-glass);
    display:flex;flex-direction:column;
    padding:28px 16px 20px;
    z-index:100;
    position:relative;
    transition:transform .4s var(--ease-smooth);
}
.sidebar::after{
    content:'';position:absolute;top:0;right:0;bottom:0;width:1px;
    background:linear-gradient(180deg, transparent, rgba(29,185,84,.4), transparent);
    opacity:.6;
}
.logo{
    font-size:22px;font-weight:800;letter-spacing:-1.2px;
    margin-bottom:36px;padding-left:12px;
    display:flex;align-items:center;gap:10px;
    position:relative;
}
.logo::before{
    content:'';width:30px;height:30px;border-radius:9px;
    background:var(--gradient-1);
    box-shadow:0 4px 20px var(--accent-glow);
    display:inline-block;flex-shrink:0;
    position:relative;
}
.logo::after{
    content:'♪';position:absolute;left:6px;top:50%;transform:translateY(-52%);
    font-size:16px;color:#000;font-weight:900;pointer-events:none;
}
.logo span{
    background:var(--gradient-1);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
}
.nav-menu{display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto}
.nav-item{
    display:flex;align-items:center;gap:14px;
    padding:12px 14px;border-radius:12px;cursor:pointer;
    color:var(--text-muted);font-weight:500;font-size:14px;
    transition:all .3s var(--ease-smooth);
    position:relative;overflow:hidden;
    flex-shrink:0;
}
.nav-item::before{
    content:'';position:absolute;inset:0;
    background:var(--gradient-1);opacity:0;transition:opacity .3s;
    z-index:-1;
}
.nav-item:hover{color:var(--text-main);background:var(--bg-card-hover)}
.nav-item.active{
    color:var(--text-main);
    background:rgba(29,185,84,.12);
    box-shadow:inset 0 0 0 1px rgba(29,185,84,.25);
}
.nav-item.active::after{
    content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:3px;height:22px;background:var(--gradient-1);
    border-radius:0 3px 3px 0;
    box-shadow:0 0 12px var(--accent-glow);
}
.nav-item svg{width:20px;height:20px;fill:currentColor;flex-shrink:0;transition:transform .3s var(--ease-spring)}
.nav-item.active svg{color:var(--accent);transform:scale(1.1)}
.nav-item:active{transform:scale(.97)}
.nav-shortcut{
    margin-left:auto;font-family:'JetBrains Mono',monospace;
    font-size:10px;color:var(--text-dim);
    padding:2px 6px;border-radius:4px;
    background:rgba(255,255,255,.05);border:1px solid var(--border-glass);
    opacity:0;transition:opacity .2s;
}
.nav-item:hover .nav-shortcut{opacity:1}
.theme-btn{
    margin-top:auto;
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:12px;border-radius:12px;
    background:var(--bg-card);border:1px solid var(--border-glass);
    color:var(--text-main);cursor:pointer;
    font-weight:600;font-size:12px;font-family:inherit;
    transition:all .3s var(--ease-smooth);
}
.theme-btn:hover{background:var(--bg-card-hover);border-color:var(--border-light);transform:translateY(-1px)}
.theme-btn:active{transform:scale(.97)}

.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:1}
.header{
    padding:28px 40px 16px;
    display:flex;justify-content:space-between;align-items:center;
    gap:20px;z-index:10;
}
.header h1{
    font-size:30px;font-weight:800;letter-spacing:-1px;
    background:linear-gradient(135deg, var(--text-main) 0%, var(--text-muted) 100%);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
    animation:fadeIn .5s var(--ease-smooth);
}
.header-actions{display:flex;align-items:center;gap:10px}
.icon-btn{
    width:42px;height:42px;border-radius:12px;
    background:var(--bg-card);border:1px solid var(--border-glass);
    color:var(--text-main);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .3s var(--ease-smooth);
    flex-shrink:0;
}
.icon-btn:hover{background:var(--bg-card-hover);border-color:var(--border-light);transform:translateY(-1px)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:18px;height:18px;fill:currentColor}
.theme-btn-mobile{display:none}
.view-container{
    flex:1;overflow-y:auto;
    padding:0 40px calc(var(--player-height) + 48px);
    scroll-behavior:smooth;
}
.view-container::-webkit-scrollbar{width:8px}
.view-container::-webkit-scrollbar-track{background:transparent}
.view-container::-webkit-scrollbar-thumb{
    background:rgba(29,185,84,.25);border-radius:99px;
    transition:background .3s;
}
.view-container::-webkit-scrollbar-thumb:hover{background:rgba(29,185,84,.5)}
.view-section{display:none}
.view-section.active{display:block;animation:viewIn .5s var(--ease-smooth)}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.music-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(88px,1fr));
    gap:10px;
}
.music-card{
    background:var(--bg-card);
    border:1px solid var(--border-glass);
    border-radius:10px;
    padding:8px;
    cursor:pointer;
    position:relative;
    transition:transform .45s var(--ease-spring),box-shadow .45s var(--ease-smooth),border-color .3s,background .3s;
    transform-style:preserve-3d;
    will-change:transform;
}
.music-card:hover{
    background:var(--bg-card-hover);
    border-color:rgba(29,185,84,.35);
    box-shadow:var(--shadow-card),var(--shadow-glow);
}
.music-card.active{
    border-color:rgba(29,185,84,.7);
    box-shadow:0 0 0 1px rgba(29,185,84,.4), 0 0 32px -4px rgba(29,185,84,.5);
}
.music-card.active .card-img-wrapper::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg, rgba(29,185,84,.3), transparent 60%);
    z-index:2;pointer-events:none;
}
.card-img-wrapper{
    width:100%;aspect-ratio:1;
    border-radius:8px;overflow:hidden;
    margin-bottom:6px;position:relative;
    background:linear-gradient(135deg, #0c1410 0%, #0a1a14 100%);
    box-shadow:0 4px 12px -6px rgba(0,0,0,.7);
    transform:translateZ(20px);
}
.card-img-wrapper::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg, transparent 60%, rgba(0,0,0,.6) 100%);
    opacity:0;transition:opacity .3s;
}
.music-card:hover .card-img-wrapper::after{opacity:1}
.card-img-wrapper img{
    width:100%;height:100%;object-fit:cover;
    transition:transform .6s var(--ease-smooth);
}
.music-card:hover .card-img-wrapper img{transform:scale(1.1)}
.card-title{
    font-size:9px;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:1px;letter-spacing:-.2px;
}
.card-artist{
    font-size:8px;color:var(--text-muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ============================================================
   BOTÕES DE AÇÃO — SEMPRE VISÍVEIS (excluir / favoritar)
============================================================ */
.fav-btn,.del-btn{
    position:absolute;top:12px;
    width:22px;height:22px;border-radius:50%;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.2);
    color:white;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .25s var(--ease-spring);
    z-index:5;padding:0;font-size:10px;
    opacity:1;                 /* ← SEMPRE VISÍVEL */
    transform:scale(1);        /* ← tamanho normal */
    box-shadow:0 2px 8px rgba(0,0,0,.6);
}
.fav-btn{right:12px;background:rgba(0,0,0,.7)}
.del-btn{left:12px;background:rgba(220,53,69,.9)}
.fav-btn:hover{transform:scale(1.2);background:rgba(29,185,84,.95)}
.fav-btn.active{background:rgba(29,185,84,.95);border-color:rgba(255,255,255,.4)}
.del-btn:hover{transform:scale(1.2);background:rgb(220,53,69)}
.del-btn svg{width:11px;height:11px;fill:white}
.fav-btn svg{width:11px;height:11px;fill:currentColor}

.bible-layout{display:flex;gap:32px;height:calc(100vh - 200px)}
.bible-sidebar{
    width:230px;overflow-y:auto;
    display:flex;flex-direction:column;gap:3px;
    padding-right:20px;border-right:1px solid var(--border-glass);
}
.bible-sidebar::-webkit-scrollbar{width:5px}
.bible-sidebar::-webkit-scrollbar-thumb{background:rgba(29,185,84,.3);border-radius:99px}
.bible-book-btn{
    padding:10px 14px;background:transparent;border:none;
    color:var(--text-muted);text-align:left;
    font-size:13px;border-radius:10px;cursor:pointer;
    transition:all .25s var(--ease-smooth);font-family:inherit;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.bible-book-btn:hover{background:var(--bg-card-hover);color:var(--text-main);transform:translateX(2px)}
.bible-book-btn.active{
    background:rgba(29,185,84,.12);color:var(--text-main);
    font-weight:600;box-shadow:inset 2px 0 0 var(--accent);
}
.bible-reader{flex:1;overflow-y:auto;padding-right:16px}
.bible-reader::-webkit-scrollbar{width:6px}
.bible-reader::-webkit-scrollbar-thumb{background:rgba(29,185,84,.3);border-radius:99px}
.chapter-selector{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.chapter-btn{
    width:40px;height:40px;border-radius:50%;
    background:var(--bg-card);border:1px solid var(--border-glass);
    color:var(--text-main);cursor:pointer;font-size:13px;
    transition:all .3s var(--ease-spring);font-family:inherit;font-weight:600;
}
.chapter-btn:hover{background:var(--bg-card-hover);border-color:var(--border-light);transform:translateY(-2px)}
.chapter-btn.active{
    background:var(--gradient-1);color:#000;font-weight:800;
    border-color:transparent;
    box-shadow:0 8px 24px -4px rgba(29,185,84,.6);
    transform:translateY(-2px);
}
.bible-text-content{
    font-family:'Playfair Display',serif;
    font-size:18px;line-height:1.95;
    color:rgba(255,255,255,.85);
}
body.light-mode .bible-text-content{color:rgba(10,10,20,.82)}
.bible-text-content p{margin-bottom:24px;animation:verseIn .5s var(--ease-smooth) backwards}
.bible-text-content p:nth-child(1){animation-delay:.05s}
.bible-text-content p:nth-child(2){animation-delay:.08s}
.bible-text-content p:nth-child(3){animation-delay:.11s}
.bible-text-content p:nth-child(n+4){animation-delay:.14s}
@keyframes verseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.verse-num{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;color:var(--accent);font-weight:700;
    margin-right:8px;vertical-align:super;
}
.tts-bar{margin-bottom:28px;display:flex;gap:10px;flex-wrap:wrap}
.tts-btn{
    padding:11px 20px;background:var(--bg-card);
    border:1px solid var(--border-glass);
    color:var(--text-main);border-radius:12px;
    font-size:13px;font-weight:600;cursor:pointer;
    transition:all .3s var(--ease-spring);font-family:inherit;
    display:inline-flex;align-items:center;gap:8px;
}
.tts-btn:hover{background:var(--bg-card-hover);border-color:rgba(29,185,84,.4);transform:translateY(-1px)}
.tts-btn.playing{
    background:var(--gradient-1);color:#000;border-color:transparent;
    box-shadow:0 8px 24px -6px rgba(29,185,84,.6);
}
.bible-download-card{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;min-height:400px;text-align:center;
    padding:56px 40px;
    background:var(--bg-card);border:1px dashed rgba(29,185,84,.3);
    border-radius:var(--radius-lg);gap:16px;
    animation:fadeIn .6s var(--ease-smooth);
}
.bible-download-card .icon{font-size:64px;filter:drop-shadow(0 8px 24px rgba(29,185,84,.5))}
.bible-download-card h2{font-size:26px;font-weight:800;letter-spacing:-.5px}
.bible-download-card p{color:var(--text-muted);max-width:400px;line-height:1.65;font-size:14px}
.btn-download{
    padding:16px 36px;background:var(--gradient-1);color:#000;
    border:none;border-radius:14px;font-size:15px;font-weight:800;
    cursor:pointer;transition:all .3s var(--ease-spring);margin-top:12px;
    font-family:inherit;letter-spacing:.3px;
    box-shadow:0 12px 32px -8px rgba(29,185,84,.6);
}
.btn-download:hover{transform:translateY(-2px) scale(1.02);filter:brightness(1.1);box-shadow:0 16px 40px -8px rgba(29,185,84,.7)}
.btn-download:disabled{opacity:.5;cursor:wait;transform:none;box-shadow:none}
.status{font-size:13px;color:var(--text-muted);min-height:20px;font-weight:500}
.status.error{color:#f87171}
.status.success{color:var(--accent)}

.yt-input-wrapper{display:flex;gap:12px;margin-bottom:32px}
.yt-input-wrapper input{
    flex:1;padding:16px 20px;
    border-radius:14px;border:1px solid var(--border-glass);
    background:var(--bg-card);color:var(--text-main);
    font-size:15px;font-family:inherit;outline:none;
    transition:all .3s var(--ease-smooth);
}
.yt-input-wrapper input:focus{
    border-color:rgba(29,185,84,.5);
    box-shadow:0 0 0 4px rgba(29,185,84,.1);
}
.btn-add{
    padding:0 28px;background:var(--gradient-1);color:#000;
    border:none;border-radius:14px;font-weight:800;font-size:14px;
    cursor:pointer;transition:all .3s var(--ease-spring);
    font-family:inherit;letter-spacing:.3px;
    box-shadow:0 8px 20px -6px rgba(29,185,84,.5);
}
.btn-add:hover{transform:translateY(-1px) scale(1.02);filter:brightness(1.1)}
.btn-add:active{transform:scale(.97)}
.yt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.yt-card{
    background:var(--bg-card);border-radius:var(--radius);
    overflow:hidden;border:1px solid var(--border-glass);
    cursor:pointer;transition:all .4s var(--ease-spring);
    position:relative;
}
.yt-card:hover{
    transform:translateY(-8px) scale(1.01);
    border-color:rgba(94,234,212,.4);
    box-shadow:var(--shadow-card),0 0 40px -12px rgba(94,234,212,.4);
}
.yt-thumb{
    width:100%;aspect-ratio:16/9;object-fit:cover;
    background:#0c1410;display:block;
    transition:transform .5s var(--ease-smooth);
}
.yt-card:hover .yt-thumb{transform:scale(1.05)}
.yt-info{padding:16px 18px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.yt-title{font-size:14px;font-weight:700;line-height:1.4;letter-spacing:-.2px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.yt-del-explicit{
    flex-shrink:0;padding:6px 10px;border-radius:8px;
    background:rgba(220,53,69,.15);border:1px solid rgba(220,53,69,.4);
    color:#f87171;font-size:11px;font-weight:700;cursor:pointer;
    transition:all .2s var(--ease-smooth);font-family:inherit;
    display:flex;align-items:center;gap:4px;
}
.yt-del-explicit:hover{background:rgba(220,53,69,.3);color:#fff;transform:scale(1.05)}
.yt-play-overlay{
    position:absolute;top:0;left:0;right:0;aspect-ratio:16/9;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.35);opacity:0;transition:opacity .3s;
}
.yt-card:hover .yt-play-overlay{opacity:1}
.yt-play-overlay .play-circle{
    width:64px;height:64px;border-radius:50%;
    background:rgba(0,0,0,.75);
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.3);
    transition:transform .3s var(--ease-spring);
}
.yt-card:hover .yt-play-overlay .play-circle{transform:scale(1.1)}
.yt-play-overlay svg{width:28px;height:28px;fill:white;margin-left:4px}

.yt-modal{
    position:fixed;inset:0;background:rgba(0,0,0,.94);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    z-index:1000;display:flex;align-items:center;justify-content:center;
    padding:20px;animation:fadeIn .3s var(--ease-smooth);
}
.yt-modal.hidden{display:none}
.yt-modal-content{
    position:relative;width:100%;max-width:960px;
    aspect-ratio:16/9;background:#000;
    border-radius:var(--radius);overflow:hidden;
    box-shadow:0 32px 80px rgba(0,0,0,.9);
    animation:modalIn .4s var(--ease-spring);
}
@keyframes modalIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.yt-modal-iframe-wrap{position:absolute;inset:0}
.yt-modal-iframe-wrap iframe{width:100%;height:100%;border:none}
.yt-modal-close{
    position:absolute;top:14px;right:14px;
    width:42px;height:42px;border-radius:50%;
    background:rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.2);
    color:white;font-size:20px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .3s var(--ease-spring);z-index:10;
    backdrop-filter:blur(12px);
}
.yt-modal-close:hover{background:rgba(255,255,255,.2);transform:scale(1.1) rotate(90deg)}

.notas-toolbar{
    display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;
    align-items:center;
}
.notas-toolbar input[type="text"]{
    flex:1;min-width:200px;
    padding:12px 16px;border-radius:12px;
    border:1px solid var(--border-glass);background:var(--bg-card);
    color:var(--text-main);font-size:14px;font-family:inherit;outline:none;
    transition:all .3s var(--ease-smooth);
}
.notas-toolbar input[type="text"]:focus{
    border-color:rgba(29,185,84,.5);
    box-shadow:0 0 0 3px rgba(29,185,84,.1);
}
.btn-nova-nota{
    padding:12px 22px;background:var(--gradient-1);color:#000;
    border:none;border-radius:12px;font-weight:800;font-size:13px;
    cursor:pointer;transition:all .3s var(--ease-spring);
    font-family:inherit;letter-spacing:.3px;
    display:flex;align-items:center;gap:6px;
    box-shadow:0 8px 20px -6px rgba(29,185,84,.5);
}
.btn-nova-nota:hover{transform:translateY(-1px) scale(1.02);filter:brightness(1.1)}

.notas-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:16px;
}
.nota-card{
    background:var(--bg-card);border:1px solid var(--border-glass);
    border-radius:14px;padding:16px;cursor:pointer;
    transition:all .3s var(--ease-spring);
    display:flex;flex-direction:column;gap:8px;
    min-height:140px;position:relative;
}
.nota-card:hover{
    background:var(--bg-card-hover);
    border-color:rgba(29,185,84,.4);
    transform:translateY(-3px);
    box-shadow:var(--shadow-card),var(--shadow-glow);
}
.nota-card-title{
    font-size:15px;font-weight:800;letter-spacing:-.3px;
    color:var(--text-main);
    overflow:hidden;text-overflow:ellipsis;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    word-break:break-word;
}
.nota-card-preview{
    font-size:12px;color:var(--text-muted);line-height:1.5;
    flex:1;overflow:hidden;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
    word-break:break-word;
}
.nota-card-meta{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    font-size:10px;color:var(--text-dim);
    padding-top:6px;border-top:1px solid var(--border-glass);
    font-family:'JetBrains Mono',monospace;
}
.nota-card-badge{
    padding:2px 6px;border-radius:4px;
    background:rgba(29,185,84,.15);color:var(--accent);
    font-weight:700;font-size:9px;
}
.nota-card-del{
    position:absolute;top:10px;right:10px;
    width:24px;height:24px;border-radius:50%;
    background:rgba(220,53,69,.85);
    border:1px solid rgba(255,255,255,.2);
    color:white;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .3s var(--ease-spring);
    opacity:0;transform:scale(.7);
    padding:0;font-size:10px;
}
.nota-card:hover .nota-card-del{opacity:1;transform:scale(1)}
.nota-card-del:hover{background:rgb(220,53,69);transform:scale(1.15)!important}
.nota-card-del svg{width:11px;height:11px;fill:white}

.nota-editor-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.85);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    z-index:1500;display:flex;align-items:center;justify-content:center;
    padding:20px;animation:fadeIn .3s var(--ease-smooth);
    opacity:0;pointer-events:none;
    transition:opacity .3s var(--ease-smooth);
}
.nota-editor-overlay.active{opacity:1;pointer-events:auto}
.nota-editor{
    width:100%;max-width:760px;max-height:90vh;
    background:var(--bg-elev);
    border:1px solid var(--border-light);
    border-radius:20px;overflow:hidden;
    display:flex;flex-direction:column;
    box-shadow:0 32px 100px -20px rgba(0,0,0,.9);
    transform:scale(.96);
    transition:transform .3s var(--ease-spring);
}
.nota-editor-overlay.active .nota-editor{transform:scale(1)}
.nota-editor-header{
    display:flex;align-items:center;gap:12px;
    padding:16px 20px;border-bottom:1px solid var(--border-glass);
    background:var(--bg-glass);
}
.nota-editor-title{
    flex:1;padding:10px 14px;border-radius:10px;
    border:1px solid var(--border-glass);background:var(--bg-card);
    color:var(--text-main);font-size:18px;font-weight:700;
    font-family:inherit;outline:none;
    transition:all .2s;
}
.nota-editor-title:focus{border-color:rgba(29,185,84,.5)}
.nota-editor-close{
    width:38px;height:38px;border-radius:10px;
    background:var(--bg-card);border:1px solid var(--border-glass);
    color:var(--text-main);cursor:pointer;font-size:16px;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;
}
.nota-editor-close:hover{background:rgba(220,53,69,.2);border-color:rgba(220,53,69,.4);color:#f87171}

.nota-editor-body{
    flex:1;overflow-y:auto;padding:20px;
    display:flex;flex-direction:column;gap:16px;
}
.nota-editor-body::-webkit-scrollbar{width:6px}
.nota-editor-body::-webkit-scrollbar-thumb{background:rgba(29,185,84,.3);border-radius:99px}

.nota-editor-text{
    min-height:200px;padding:14px 16px;border-radius:12px;
    border:1px solid var(--border-glass);background:var(--bg-card);
    color:var(--text-main);font-size:14px;font-family:inherit;
    line-height:1.6;outline:none;resize:vertical;
    transition:all .2s;
}
.nota-editor-text:focus{border-color:rgba(29,185,84,.5)}

.nota-attach-bar{
    display:flex;gap:8px;flex-wrap:wrap;
}
.nota-attach-btn{
    padding:10px 16px;border-radius:10px;
    background:var(--bg-card);border:1px solid var(--border-glass);
    color:var(--text-main);cursor:pointer;font-size:13px;
    font-weight:600;font-family:inherit;
    display:flex;align-items:center;gap:6px;
    transition:all .25s var(--ease-spring);
}
.nota-attach-btn:hover{
    background:var(--bg-card-hover);
    border-color:rgba(29,185,84,.4);
    transform:translateY(-1px);
}
.nota-attach-btn.recording{
    background:rgba(220,53,69,.2);
    border-color:rgba(220,53,69,.5);
    color:#f87171;
    animation:pulseRec 1.2s ease-in-out infinite;
}
@keyframes pulseRec{0%,100%{opacity:1}50%{opacity:.6}}

.nota-fotos{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
    gap:10px;
}
.nota-foto{
    position:relative;aspect-ratio:1;border-radius:10px;
    overflow:hidden;border:1px solid var(--border-glass);
    background:var(--bg-card);
}
.nota-foto img{width:100%;height:100%;object-fit:cover}
.nota-foto-del{
    position:absolute;top:4px;right:4px;
    width:22px;height:22px;border-radius:50%;
    background:rgba(220,53,69,.9);border:none;
    color:white;font-size:11px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .2s;
}
.nota-foto-del:hover{transform:scale(1.15)}

.nota-links{
    display:flex;flex-direction:column;gap:8px;
}
.nota-link-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;border-radius:10px;
    background:var(--bg-card);border:1px solid var(--border-glass);
}
.nota-link-item a{
    flex:1;color:var(--accent);text-decoration:none;
    font-size:13px;word-break:break-all;
    transition:color .2s;
}
.nota-link-item a:hover{color:var(--accent-2);text-decoration:underline}
.nota-link-del{
    width:26px;height:26px;border-radius:50%;
    background:rgba(220,53,69,.85);border:none;
    color:white;font-size:11px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .2s;flex-shrink:0;
}
.nota-link-del:hover{transform:scale(1.1)}

.nota-audios{
    display:flex;flex-direction:column;gap:8px;
}
.nota-audio-item{
    display:flex;align-items:center;gap:10px;
    padding:10px;border-radius:10px;
    background:var(--bg-card);border:1px solid var(--border-glass);
}
.nota-audio-item audio{flex:1;height:36px}
.nota-audio-del{
    width:26px;height:26px;border-radius:50%;
    background:rgba(220,53,69,.85);border:none;
    color:white;font-size:11px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
}

.nota-editor-footer{
    display:flex;justify-content:flex-end;gap:10px;
    padding:14px 20px;border-top:1px solid var(--border-glass);
    background:var(--bg-glass);
}
.nota-editor-save{
    padding:12px 24px;background:var(--gradient-1);color:#000;
    border:none;border-radius:10px;font-weight:800;font-size:13px;
    cursor:pointer;transition:all .3s var(--ease-spring);
    font-family:inherit;letter-spacing:.3px;
    box-shadow:0 8px 20px -6px rgba(29,185,84,.5);
}
.nota-editor-save:hover{transform:translateY(-1px) scale(1.02);filter:brightness(1.1)}
.nota-editor-cancel{
    padding:12px 20px;background:var(--bg-card);
    border:1px solid var(--border-glass);color:var(--text-main);
    border-radius:10px;font-weight:600;font-size:13px;
    cursor:pointer;transition:all .2s;font-family:inherit;
}
.nota-editor-cancel:hover{background:var(--bg-card-hover)}

.player-bar{
    position:absolute;bottom:12px;left:16px;right:16px;
    height:var(--player-height);
    background:var(--bg-glass-strong);
    backdrop-filter:blur(40px) saturate(1.6);
    -webkit-backdrop-filter:blur(40px) saturate(1.6);
    border:1px solid var(--border-glass);
    border-radius:var(--radius-lg);
    display:flex;align-items:center;
    padding:0 20px;gap:20px;z-index:200;
    box-shadow:0 24px 60px -12px rgba(0,0,0,.9),
               0 0 0 1px rgba(255,255,255,.03),
               0 0 60px -20px rgba(29,185,84,.3);
    transition:box-shadow .5s;
}
.now-playing{
    display:flex;align-items:center;gap:14px;
    width:28%;min-width:180px;cursor:pointer;
    transition:opacity .3s;
}
.now-playing:hover{opacity:.85}
.np-cover{
    width:56px;height:56px;border-radius:12px;
    background:linear-gradient(135deg, #0c1410, #0a1a14);
    overflow:hidden;position:relative;
    box-shadow:0 8px 24px -8px rgba(0,0,0,.8);
    transition:transform .3s var(--ease-spring);
    flex-shrink:0;
}
.now-playing:hover .np-cover{transform:scale(1.05)}
.np-cover img{width:100%;height:100%;object-fit:cover}
.np-cover.playing::after{
    content:'';position:absolute;inset:-2px;
    border-radius:14px;
    background:conic-gradient(from 0deg, #1DB954, #5EEAD4, #1DB954);
    z-index:-1;
    animation:spinRing 3s linear infinite;
    opacity:.7;
    filter:blur(4px);
}
@keyframes spinRing{to{transform:rotate(360deg)}}
.np-info{flex:1;min-width:0}
.np-title{
    font-size:14px;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:2px;letter-spacing:-.2px;
}
.np-artist{
    font-size:12px;color:var(--text-muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.player-controls{
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    flex:1;gap:8px;max-width:560px;
}
.controls-btns{display:flex;align-items:center;gap:16px}
.ctrl-btn{
    background:none;border:none;color:var(--text-main);
    cursor:pointer;transition:all .25s var(--ease-spring);
    display:flex;align-items:center;justify-content:center;
    padding:6px;border-radius:50%;
}
.ctrl-btn:hover{transform:scale(1.15);color:#5EEAD4}
.ctrl-btn:active{transform:scale(.92)}
.ctrl-btn svg{width:22px;height:22px;fill:currentColor}
.play-pause-btn{
    width:48px;height:48px;border-radius:50%;
    background:var(--gradient-1);
    color:#000 !important;
    margin:0 6px;
    box-shadow:0 8px 24px -4px rgba(29,185,84,.6);
    transition:all .3s var(--ease-spring);
    position:relative;
}
.play-pause-btn::before{
    content:'';position:absolute;inset:-4px;
    border-radius:50%;
    background:var(--gradient-1);
    opacity:.4;filter:blur(12px);
    z-index:-1;transition:opacity .3s;
}
.play-pause-btn:hover{
    transform:scale(1.08);
    box-shadow:0 12px 32px -4px rgba(29,185,84,.7);
}
.play-pause-btn:hover::before{opacity:.7}
.play-pause-btn svg{width:22px;height:22px;margin-left:2px}
.play-pause-btn.playing svg{margin-left:0}
.ctrl-btn.side-btn{color:var(--text-muted);position:relative}
.ctrl-btn.side-btn.active{color:var(--accent)}
.ctrl-btn.side-btn.active::after{
    content:'';position:absolute;bottom:-4px;left:50%;
    transform:translateX(-50%);
    width:4px;height:4px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px var(--accent);
}
.progress-container{
    display:flex;align-items:center;gap:12px;
    width:100%;font-size:11px;color:var(--text-muted);
    font-variant-numeric:tabular-nums;
    font-family:'JetBrains Mono',monospace;
}
.progress-bar{
    flex:1;height:4px;background:rgba(255,255,255,.08);
    border-radius:99px;cursor:pointer;position:relative;
    touch-action:none;overflow:visible;
    transition:height .2s;
}
.progress-bar:hover{height:6px}
.progress-fill{
    height:100%;background:var(--gradient-1);
    border-radius:99px;width:0%;
    position:relative;
    box-shadow:0 0 12px rgba(29,185,84,.6);
    transition:width .1s linear;
}
.progress-fill::after{
    content:'';position:absolute;right:-7px;top:50%;
    transform:translateY(-50%) scale(0);
    width:14px;height:14px;background:#fff;border-radius:50%;
    transition:transform .2s var(--ease-spring);
    box-shadow:0 0 12px rgba(29,185,84,.8);
}
.progress-bar:hover .progress-fill::after{transform:translateY(-50%) scale(1)}
.right-controls{
    display:flex;align-items:center;justify-content:flex-end;
    gap:14px;min-width:200px;
}
.volume-wrap{display:flex;align-items:center;gap:8px}
.volume-slider{
    width:80px;height:4px;
    -webkit-appearance:none;appearance:none;
    background:rgba(255,255,255,.12);border-radius:99px;
    outline:none;cursor:pointer;
}
.volume-slider::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;
    border-radius:50%;background:#fff;cursor:pointer;
    box-shadow:0 0 8px #5EEAD4;
    transition:transform .2s;
}
.volume-slider::-webkit-slider-thumb:hover{transform:scale(1.2)}
.volume-slider::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;
    background:#fff;cursor:pointer;border:none;
}
.visualizer{
    display:flex;align-items:flex-end;gap:3px;height:32px;
    opacity:.85;width:60px;
}
.visualizer .bar{
    flex:1;background:var(--gradient-1);
    border-radius:2px 2px 0 0;
    min-height:2px;
    transition:height .08s linear;
}

.expanded-player{
    position:fixed;inset:0;z-index:500;
    background:#06060a;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:40px 20px;
    overflow:hidden;
    opacity:0;pointer-events:none;
    transition:opacity .5s var(--ease-smooth);
}
.expanded-player.active{opacity:1;pointer-events:auto}
.expanded-bg{
    position:absolute;inset:0;
    background-size:cover;background-position:center;
    filter:blur(80px) saturate(1.8) brightness(.4);
    transform:scale(1.2);
    opacity:.7;
    transition:background-image .6s;
    z-index:-2;
}
.expanded-player::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 50% 50%, transparent, rgba(6,6,10,.6));
    z-index:-1;
}
.expanded-close{
    position:absolute;top:24px;right:24px;
    width:44px;height:44px;border-radius:50%;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.12);
    color:white;cursor:pointer;font-size:18px;
    display:flex;align-items:center;justify-content:center;
    transition:all .3s var(--ease-spring);
    z-index:10;
}
.expanded-close:hover{background:rgba(255,255,255,.16);transform:rotate(90deg) scale(1.1)}
.expanded-content{
    display:flex;flex-direction:column;
    align-items:center;
    gap:28px;
    max-width:520px;width:100%;
    z-index:1;
}
.expanded-art{
    width:100%;max-width:360px;aspect-ratio:1;
    border-radius:24px;overflow:hidden;
    box-shadow:0 40px 100px -20px rgba(0,0,0,.9),
               0 0 80px -10px rgba(29,185,84,.4);
    position:relative;
    animation:artFloat 6s ease-in-out infinite;
    transform-origin:center;
}
@keyframes artFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.expanded-art img{width:100%;height:100%;object-fit:cover}
.expanded-art.playing::before{
    content:'';position:absolute;inset:-3px;border-radius:26px;
    background:conic-gradient(from 0deg, #1DB954, #5EEAD4, #1DB954);
    z-index:-1;animation:spinRing 4s linear infinite;
    opacity:.6;filter:blur(8px);
}
.expanded-info{text-align:center;color:#fff}
.expanded-info h1{
    font-size:24px;font-weight:800;
    margin-bottom:6px;letter-spacing:-.5px;
}
.expanded-info p{color:rgba(255,255,255,.6);font-size:14px}
.expanded-viz{
    width:100%;height:80px;
    display:block;
}
.expanded-progress{
    width:100%;
    display:flex;flex-direction:column;gap:8px;
    color:rgba(255,255,255,.7);
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
}
.expanded-progress .times{display:flex;justify-content:space-between}
.expanded-progress .bar-wrap{
    height:5px;background:rgba(255,255,255,.12);
    border-radius:99px;cursor:pointer;position:relative;
    overflow:hidden;
}
.expanded-progress .bar-fill{
    height:100%;background:linear-gradient(90deg, #1DB954, #5EEAD4);
    border-radius:99px;width:0%;transition:width .1s linear;
    box-shadow:0 0 16px rgba(29,185,84,.6);
}
.expanded-controls{
    display:flex;align-items:center;gap:24px;
}
.expanded-controls .ctrl-btn{color:#fff}
.expanded-controls .ctrl-btn:hover{color:#5EEAD4}
.expanded-controls .play-pause-btn{width:64px;height:64px;}
.expanded-controls .play-pause-btn svg{width:28px;height:28px}
.expanded-controls .ctrl-btn svg{width:26px;height:26px}

.fab{
    position:absolute;bottom:calc(var(--player-height) + 32px);
    right:32px;width:56px;height:56px;border-radius:50%;
    background:var(--gradient-1);color:#000;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 32px rgba(29,185,84,.55);
    cursor:pointer;z-index:150;
    transition:all .4s var(--ease-spring);
}
.fab:hover{transform:scale(1.1) rotate(90deg);box-shadow:0 16px 40px rgba(29,185,84,.7)}
.fab:active{transform:scale(.94) rotate(90deg)}
.fab svg{width:26px;height:26px;fill:currentColor}

.toast{
    position:fixed;bottom:calc(var(--player-height) + 100px);
    left:50%;transform:translateX(-50%) translateY(120px);
    opacity:0;background:rgba(20,20,28,.98);
    color:var(--text-main);padding:14px 24px;
    border-radius:14px;font-size:13px;font-weight:600;
    box-shadow:0 24px 48px -12px rgba(0,0,0,.9);
    z-index:600;
    transition:all .4s var(--ease-spring);
    border:1px solid var(--border-glass);
    border-left:3px solid var(--accent);
    max-width:90vw;
    backdrop-filter:blur(20px);
    font-family:inherit;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.error{border-left-color:#f87171}
.toast.success{border-left-color:var(--accent)}

.palette-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.6);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    z-index:2000;
    display:flex;align-items:flex-start;justify-content:center;
    padding-top:15vh;
    opacity:0;pointer-events:none;
    transition:opacity .25s var(--ease-smooth);
}
.palette-overlay.active{opacity:1;pointer-events:auto}
.palette{
    width:100%;max-width:600px;
    background:var(--bg-glass-strong);
    border:1px solid var(--border-light);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 32px 100px -20px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.03);
    transform:translateY(-20px) scale(.96);
    transition:transform .3s var(--ease-spring);
    backdrop-filter:blur(40px);
}
.palette-overlay.active .palette{transform:translateY(0) scale(1)}
.palette-input-wrap{
    display:flex;align-items:center;gap:12px;
    padding:18px 22px;
    border-bottom:1px solid var(--border-glass);
}
.palette-input-wrap svg{width:20px;height:20px;fill:var(--text-muted);flex-shrink:0}
.palette-input-wrap input{
    flex:1;background:none;border:none;outline:none;
    color:var(--text-main);font-size:16px;font-family:inherit;
}
.palette-input-wrap input::placeholder{color:var(--text-dim)}
.palette-kbd{
    font-family:'JetBrains Mono',monospace;font-size:10px;
    color:var(--text-muted);
    padding:3px 7px;border-radius:5px;
    background:rgba(255,255,255,.06);
    border:1px solid var(--border-glass);
}
.palette-results{
    max-height:400px;overflow-y:auto;
    padding:8px;
}
.palette-results::-webkit-scrollbar{width:6px}
.palette-results::-webkit-scrollbar-thumb{background:rgba(29,185,84,.3);border-radius:99px}
.palette-item{
    display:flex;align-items:center;gap:14px;
    padding:12px 14px;border-radius:12px;cursor:pointer;
    transition:background .15s;
    color:var(--text-main);font-size:14px;
}
.palette-item:hover,
.palette-item.selected{background:rgba(29,185,84,.15);}
.palette-item-icon{
    width:32px;height:32px;border-radius:8px;
    background:rgba(255,255,255,.05);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;font-size:16px;
    overflow:hidden;
}
.palette-item-icon img{width:100%;height:100%;object-fit:cover}
.palette-item-content{flex:1;min-width:0}
.palette-item-title{
    font-size:13px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.palette-item-sub{
    font-size:11px;color:var(--text-muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.palette-item-hint{
    font-size:10px;color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;
    padding:2px 6px;border-radius:4px;
    background:rgba(255,255,255,.04);
}
.palette-footer{
    display:flex;gap:16px;
    padding:10px 20px;
    background:rgba(0,0,0,.2);
    border-top:1px solid var(--border-glass);
    font-size:11px;color:var(--text-muted);
    font-family:'JetBrains Mono',monospace;
}
.palette-footer span{display:flex;align-items:center;gap:4px}
.palette-empty{
    text-align:center;padding:40px 20px;
    color:var(--text-muted);font-size:13px;
}
.palette-empty .emoji{font-size:32px;display:block;margin-bottom:8px;opacity:.5}

.empty-state{
    grid-column:1/-1;text-align:center;
    padding:80px 20px;
    animation:fadeIn .5s var(--ease-smooth);
}
.empty-state .emoji{font-size:56px;margin-bottom:16px;opacity:.7;display:block}
.empty-state p{color:var(--text-muted);font-size:14px;line-height:1.7}

.sleep-timer-menu{
    position:absolute;
    bottom:calc(var(--player-height) + 24px);
    right:16px;
    background:var(--bg-glass-strong);
    backdrop-filter:blur(32px);
    border:1px solid var(--border-light);
    border-radius:16px;
    padding:8px;
    z-index:250;
    min-width:200px;
    box-shadow:0 24px 60px -12px rgba(0,0,0,.9);
    opacity:0;pointer-events:none;
    transform:translateY(10px);
    transition:all .3s var(--ease-spring);
}
.sleep-timer-menu.active{opacity:1;pointer-events:auto;transform:translateY(0)}
.sleep-timer-menu button{
    display:flex;align-items:center;gap:10px;
    width:100%;padding:10px 14px;
    background:none;border:none;
    color:var(--text-main);cursor:pointer;
    font-size:13px;font-family:inherit;
    border-radius:10px;transition:background .2s;
    text-align:left;
}
.sleep-timer-menu button:hover{background:rgba(29,185,84,.15)}
.sleep-timer-menu button.active{color:var(--accent);font-weight:600}
.sleep-timer-menu button svg{width:16px;height:16px;fill:currentColor;flex-shrink:0}

@media (max-width:900px){
    .kbd-hint{display:none}
}
@media (max-width:768px){
    :root{--player-height:74px}
    .sidebar{
        position:fixed;bottom:0;left:0;right:0;
        width:100%;height:64px;
        flex-direction:row;padding:0;
        border-right:none;border-top:1px solid var(--border-glass);
        z-index:300;
        background:rgba(10,10,16,.95);
        backdrop-filter:blur(32px);
        border-radius:0;
    }
    .sidebar::after{display:none}
    .logo,.theme-btn{display:none}
    .nav-menu{
        flex-direction:row;width:100%;
        justify-content:space-around;align-items:center;
        overflow-x:auto;
    }
    .nav-item{
        flex-direction:column;gap:2px;padding:6px 4px;
        font-size:9px;border-radius:0;flex:1;min-width:60px;
        transition:color .2s;
    }
    .nav-item.active::after{display:none}
    .nav-item.active{background:transparent;color:var(--accent);box-shadow:none}
    .nav-item.active svg{transform:scale(1.15)}
    .nav-item svg{width:18px;height:18px}
    .nav-shortcut{display:none}
    .main-content{margin-bottom:64px}
    .header{padding:18px 16px 10px;flex-wrap:wrap}
    .header h1{font-size:22px}
    .header-actions{gap:8px}
    .icon-btn{width:38px;height:38px}
    .theme-btn-mobile{display:flex}
    .view-container{padding:0 16px calc(var(--player-height) + 84px)}
    .music-grid{grid-template-columns:repeat(4,1fr);gap:8px}
    .music-card{padding:6px;border-radius:8px}
    .card-img-wrapper{margin-bottom:4px;border-radius:6px}
    .card-title{font-size:8px}
    .card-artist{font-size:7px}

    /* Botões SEMPRE visíveis no mobile, um pouco maiores p/ touch */
    .fav-btn,.del-btn{top:6px;width:20px;height:20px;font-size:9px;opacity:1;transform:scale(1)}
    .fav-btn{right:6px}
    .del-btn{left:6px}
    .del-btn svg{width:10px;height:10px}
    .fav-btn svg{width:10px;height:10px}

    .bible-layout{flex-direction:column;height:auto}
    .bible-sidebar{
        width:100%;height:auto;
        border-right:none;border-bottom:1px solid var(--border-glass);
        padding:0 0 12px;flex-direction:row;
        overflow-x:auto;overflow-y:hidden;
    }
    .bible-sidebar::-webkit-scrollbar{height:0}
    .bible-book-btn{white-space:nowrap;flex-shrink:0}
    .notas-grid{grid-template-columns:1fr;gap:12px}
    .nota-editor-header{flex-wrap:wrap}
    .nota-editor-title{font-size:15px;min-width:100%}
    .nota-editor{max-height:95vh;border-radius:14px}
    .nota-editor-body{padding:14px;gap:12px}
    .nota-editor-text{min-height:140px}
    .player-bar{
        bottom:0;left:0;right:0;
        height:var(--player-height);
        padding:0 14px;gap:10px;
        border-radius:20px 20px 0 0;
        border:1px solid var(--border-glass);
        border-bottom:none;
    }
    .now-playing{width:auto;flex:1}
    .np-cover{width:44px;height:44px;border-radius:10px}
    .np-title{font-size:12px}
    .np-artist{font-size:10px}
    .player-controls{flex:0}
    .right-controls{display:none}
    .controls-btns{gap:8px}
    .ctrl-btn svg{width:20px;height:20px}
    .play-pause-btn{width:42px;height:42px}
    .play-pause-btn svg{width:18px;height:18px}
    .side-btn{display:none}
    #shuffleBtn,#repeatBtn{display:flex}
    .progress-container{
        position:absolute;top:0;left:0;right:0;
        width:100%;height:12px;padding:0;
        gap:0;display:flex;align-items:center;
    }
    .progress-container>span{display:none}
    .progress-bar{height:3px;border-radius:0;width:100%;background:rgba(255,255,255,.08);}
    .progress-bar:hover{height:3px}
    .progress-fill{border-radius:0}
    .progress-fill::after{display:none}
    .fab{bottom:calc(var(--player-height) + 76px);right:16px;width:52px;height:52px}
    .yt-modal{padding:8px}
    .splash-img,#splashSvg{width:130px;height:130px}
    .toast{bottom:calc(64px + 80px);font-size:12px;padding:12px 18px}
    .expanded-art{max-width:260px}
    .expanded-info h1{font-size:20px}
    .expanded-viz{height:60px}
    .expanded-controls{gap:16px}
    .expanded-controls .play-pause-btn{width:56px;height:56px}
    .sleep-timer-menu{bottom:calc(var(--player-height) + 16px);right:12px}
    .palette-overlay{padding-top:8vh;padding-left:12px;padding-right:12px}
    .palette{max-width:100%}
}
@media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
        transition-duration:.01ms!important;
        scroll-behavior:auto!important;
    }
}
button:focus-visible,.progress-bar:focus-visible,input:focus-visible,textarea:focus-visible,.palette-item:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
}
</style>
</head>
<body>

<div id="splashScreen">
    <div class="splash-content">
        <img src="logo.png" alt="Dauplay" class="splash-img" onerror="this.style.display='none';document.getElementById('splashSvg').style.display='block';">
        <svg id="splashSvg" style="display:none" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#5eead4"/>
                    <stop offset="100%" stop-color="#1db954"/>
                </linearGradient>
            </defs>
            <rect width="200" height="200" rx="40" fill="#06060a" stroke="url(#g1)" stroke-width="2"/>
            <path d="M 60 40 L 110 40 C 150 40 170 70 170 100 C 170 130 150 160 110 160 L 60 160 Z" fill="white"/>
            <path d="M 60 100 L 170 100 C 170 130 150 160 110 160 L 60 160 Z" fill="url(#g1)"/>
            <path d="M 80 70 L 110 70 C 130 70 140 85 140 100 C 140 115 130 130 110 130 L 80 130 Z" fill="#06060a"/>
            <polygon points="105,85 105,115 130,100" fill="url(#g1)"/>
            <text x="100" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="white">Dau<tspan fill="url(#g1)">play</tspan></text>
        </svg>
    </div>
    <div class="splash-loader"><div class="splash-bar"></div></div>
</div>

<aside class="sidebar">
    <div class="logo">Dau<span>play</span></div>
    <nav class="nav-menu">
        <div class="nav-item active" data-view="musicas">
            <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
            <span>Músicas</span>
            <span class="nav-shortcut">1</span>
        </div>
        <div class="nav-item" data-view="favoritas">
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <span>Favoritas</span>
            <span class="nav-shortcut">2</span>
        </div>
        <div class="nav-item" data-view="biblia">
            <svg viewBox="0 0 24 24"><path d="M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 2v16h12V4H6zm2 2h8v2H8V6zm0 4h8v2H8v-2zm0 4h5v2H8v-2z"/></svg>
            <span>Bíblia</span>
            <span class="nav-shortcut">3</span>
        </div>
        <div class="nav-item" data-view="youtube">
            <svg viewBox="0 0 24 24"><path d="M21.58 7.19a2.5 2.5 0 0 0-1.76-1.77C18.25 5 12 5 12 5s-6.25 0-7.82.42A2.5 2.5 0 0 0 2.42 7.19 26.18 26.18 0 0 0 2 12a26.18 26.18 0 0 0 .42 4.81 2.5 2.5 0 0 0 1.76 1.77C5.75 19 12 19 12 19s6.25 0 7.82-.42a2.5 2.5 0 0 0 1.76-1.77A26.18 26.18 0 0 0 22 12a26.18 26.18 0 0 0-.42-4.81zM10 15V9l5.2 3L10 15z"/></svg>
            <span>YouTube</span>
            <span class="nav-shortcut">4</span>
        </div>
        <div class="nav-item" data-view="notas">
            <svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-2 14H7v-2h10v2zm0-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            <span>Notas</span>
            <span class="nav-shortcut">5</span>
        </div>
    </nav>
    <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">☀️ Tema Claro</button>
</aside>

<main class="main-content">
    <header class="header">
        <h1 id="pageTitle">Músicas</h1>
        <div class="header-actions">
            <button class="icon-btn" onclick="openPalette()" title="Command Palette (⌘K)" aria-label="Comandos">
                <svg viewBox="0 0 24 24"><path d="M9 3H7c-1.1 0-2 .9-2 2v2c0 1.1-.9 2-2 2s2 .9 2 2v2c0 1.1.9 2 2 2h2v-2H7v-2c0-1.1-.9-2-2-2s2-.9 2-2V5h2V3zm10 6c-1.1 0-2-.9-2-2V5c0-1.1-.9-2-2-2h-2v2h2v2c0 1.1.9 2 2 2s-2 .9-2 2v2c0 1.1-.9 2-2 2h-2v2h2c1.1 0 2-.9 2-2v-2c0-1.1.9-2 2-2s-2-.9-2-2z"/></svg>
            </button>
            <button class="icon-btn theme-btn-mobile" id="themeToggleMobile" onclick="toggleTheme()" aria-label="Alternar tema">☀️</button>
        </div>
    </header>

    <div class="view-container">
        <div id="view-musicas" class="view-section active"><div class="music-grid" id="musicGrid"></div></div>
        <div id="view-favoritas" class="view-section"><div class="music-grid" id="favGrid"></div></div>
        <div id="view-biblia" class="view-section"><div id="bibleContainer"></div></div>
        <div id="view-youtube" class="view-section">
            <div class="yt-input-wrapper">
                <input type="text" id="ytInput" placeholder="Cole o link do YouTube..." aria-label="Link do YouTube">
                <button class="btn-add" onclick="addYoutubeLink()">Salvar</button>
            </div>
            <div class="yt-grid" id="ytGrid"></div>
        </div>
        <div id="view-notas" class="view-section">
            <div class="notas-toolbar">
                <input type="text" id="notasSearch" placeholder="Buscar nas notas..." aria-label="Buscar notas">
                <button class="btn-nova-nota" onclick="openNotaEditor()">
                    <svg viewBox="0 0 24 24" style="width:16px;height:16px;fill:currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    Nova Nota
                </button>
            </div>
            <div class="notas-grid" id="notasGrid"></div>
        </div>
    </div>

    <div class="fab" id="fabAdd" onclick="document.getElementById('musicUpload').click()" title="Adicionar Música" aria-label="Adicionar música">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        <input type="file" id="musicUpload" accept="audio/*" multiple hidden onchange="handleMusicUpload(event)">
    </div>

    <div class="sleep-timer-menu" id="sleepMenu">
        <button data-sleep="0"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>Desativado</button>
        <button data-sleep="5">5 minutos</button>
        <button data-sleep="15">15 minutos</button>
        <button data-sleep="30">30 minutos</button>
        <button data-sleep="60">60 minutos</button>
        <button data-sleep="end">Fim da faixa</button>
    </div>

    <div class="player-bar">
        <div class="now-playing" onclick="openExpanded()" title="Abrir player expandido">
            <div class="np-cover" id="npCover">
                <img id="npImg" src="" alt="" style="display:none;">
                <span id="npIcon" style="display:flex;width:100%;height:100%;align-items:center;justify-content:center;font-size:22px;">🎵</span>
            </div>
            <div class="np-info">
                <div class="np-title" id="npTitle">Dauplay Pronto</div>
                <div class="np-artist" id="npArtist">Escolha uma música para começar</div>
            </div>
        </div>

        <div class="player-controls">
            <div class="controls-btns">
                <button class="ctrl-btn side-btn" id="shuffleBtn" onclick="toggleShuffle()" aria-label="Aleatório" title="Aleatório">
                    <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                </button>
                <button class="ctrl-btn" onclick="prevSong()" aria-label="Anterior" title="Anterior">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="ctrl-btn play-pause-btn" id="playBtn" onclick="togglePlay()" aria-label="Reproduzir" title="Play/Pause (Espaço)">
                    <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="ctrl-btn" onclick="nextSong(false)" aria-label="Próxima" title="Próxima">
                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
                <button class="ctrl-btn side-btn" id="repeatBtn" onclick="toggleRepeat()" aria-label="Repetir" title="Repetir">
                    <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                </button>
            </div>
            <div class="progress-container">
                <span id="currentTime">0:00</span>
                <div class="progress-bar" id="progressBar" role="slider" tabindex="0" aria-label="Progresso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span id="totalTime">0:00</span>
            </div>
        </div>

        <div class="right-controls">
            <button class="ctrl-btn" id="sleepBtn" onclick="toggleSleepMenu(event)" title="Sleep Timer" aria-label="Sleep Timer">
                <svg viewBox="0 0 24 24"><path d="M12.34 2.02C6.59 1.82 2 6.42 2 12c0 5.52 4.48 10 10 10 3.71 0 6.93-2.02 8.66-5.02-7.51-.25-12.09-8.43-8.32-14.96z"/></svg>
            </button>

<script>
const $ = (id) => document.getElementById(id);
let toastTimer = null;

function toast(msg, type) {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

const fmtTime = (s) => {
    if (!isFinite(s) || s < 0) return '0:00';
    return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
};
const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function fetchWithTimeout(url, ms = 30000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms);
    try { return await fetch(url, { signal: controller.signal }); }
    finally { clearTimeout(timer); }
}

window.addEventListener('load', () => {
    setTimeout(() => {
        const splash = $('splashScreen');
        if (splash) {
            splash.classList.add('fade-out');
            setTimeout(() => splash.remove(), 700);
        }
    }, 1600);
});

/* INDEXEDDB */
const DB_NAME = 'dauplay_db';
const DB_VERSION = 2;
function openDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains('bible')) db.createObjectStore('bible');
            if (!db.objectStoreNames.contains('music')) db.createObjectStore('music');
            if (!db.objectStoreNames.contains('notas')) db.createObjectStore('notas', { keyPath: 'id' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}
async function dbPut(store, key, val) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).put(val, key);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
    });
}
async function dbGet(store, key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readonly');
        const req = tx.objectStore(store).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}
async function dbDelete(store, key) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readwrite');
        tx.objectStore(store).delete(key);
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
    });
}
async function notasDbPut(nota) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction('notas', 'readwrite');
        const req = tx.objectStore('notas').put(nota);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
        tx.onerror = () => reject(tx.error);
    });
}
async function notasDbGetAll() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction('notas', 'readonly');
        const req = tx.objectStore('notas').getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
    });
}
async function notasDbDelete(id) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const tx = db.transaction('notas', 'readwrite');
        const req = tx.objectStore('notas').delete(id);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
        tx.onerror = () => reject(tx.error);
    });
}

/* STATE */
let allSongs = [];
let currentId = null;
let ytLinks = [];
let favorites = new Set();
let recentTracks = [];
let BIBLE_DATA = null;
let currentBookIndex = null;
let currentChapterIndex = 0;
let isShuffle = false;
let repeatMode = 'off';
let ttsPlaying = false;
let ttsQueue = [];
let ttsIndex = 0;
let _voiceCache = null;
let currentBlobURL = null;
let sleepTimerId = null;
let sleepMode = 'off';
let audioCtx = null;
let analyser = null;
let sourceNode = null;
let vizData = null;
let vizRAF = null;
let expandedVizRAF = null;
let allNotas = [];
let editingNota = null;
let mediaRecorder = null;
let recordedChunks = [];
let recStream = null;
let recTimeoutId = null;

const audio = $('audioPlayer');
function getCurrentIndex() { if (!currentId) return -1; return allSongs.findIndex(s => s.id === currentId); }

function toggleTheme() {
    document.body.classList.toggle('light-mode');
    const isLight = document.body.classList.contains('light-mode');
    $('themeToggle').textContent = isLight ? '🌙 Tema Escuro' : '☀️ Tema Claro';
    $('themeToggleMobile').textContent = isLight ? '🌙' : '☀️';
    localStorage.setItem('dauplay_theme', isLight ? 'light' : 'dark');
}

document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
        const view = item.dataset.view;
        if (view !== 'biblia' && ttsPlaying) stopTTS();
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        $('view-' + view).classList.add('active');
        $('pageTitle').textContent = item.querySelector('span').textContent.trim();
        const fab = $('fabAdd');
        if (fab) fab.style.display = (view === 'musicas' || view === 'favoritas') ? 'flex' : 'none';
        if (view === 'biblia') initBibleView();
        if (view === 'youtube') renderYoutube();
        if (view === 'favoritas') renderFavorites();
        if (view === 'notas') renderNotas();
    });
});

const DEMO_SONGS = [
    { id: 'demo1', title: 'Acoustic Breeze', artist: 'Dauplay Demo', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', cover: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400&h=400&fit=crop' },
    { id: 'demo2', title: 'Summer Vibes', artist: 'Dauplay Demo', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', cover: 'https://images.unsplash.com/photo-1493225457124-a1a2a5f5646f?w=400&h=400&fit=crop' },
    { id: 'demo3', title: 'Worship Piano', artist: 'Dauplay Demo', url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3', cover: 'https://images.unsplash.com/photo-1445985543470-41fba5c3144a?w=400&h=400&fit=crop' }
];
async function loadSongs() {
    const savedStr = localStorage.getItem('dauplay_songs');
    if (savedStr === null) allSongs = [...DEMO_SONGS];
    else { try { const p = JSON.parse(savedStr); allSongs = Array.isArray(p) ? p : []; } catch { allSongs = []; } }
    renderSongs();
}
function persistSongs() {
    const meta = allSongs.map(s => ({
        id: s.id, title: s.title, artist: s.artist,
        local: s.local || false, cover: s.cover || null,
        url: s.local ? null : s.url
    }));
    localStorage.setItem('dauplay_songs', JSON.stringify(meta));
}
function persistFavs() { localStorage.setItem('dauplay_favs', JSON.stringify([...favorites])); }
function renderSongs() { renderSongsGrid($('musicGrid'), allSongs); renderFavorites(); }
function renderFavorites() {
    const grid = $('favGrid');
    if (!grid) return;
    const favSongs = allSongs.filter(s => favorites.has(s.id));
    if (favSongs.length === 0) {
        grid.innerHTML = `<div class="empty-state"><div class="emoji">💚</div><p>Nenhuma música favoritada ainda.<br>Toque no 🤍 para adicionar aqui.</p></div>`;
        return;
    }
    renderSongsGrid(grid, favSongs);
}
function renderSongsGrid(gridEl, songsArray) {
    if (songsArray.length === 0) {
        gridEl.innerHTML = `<div class="empty-state"><div class="emoji">🎵</div><p>Nenhuma música aqui.<br>Toque no + para adicionar músicas.</p></div>`;
        return;
    }
    gridEl.innerHTML = songsArray.map(song => {
        const isFav = favorites.has(song.id);
        const isCurrent = song.id === currentId;
        const cover = song.cover || 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400&h=400&fit=crop';
        return `
            <div class="music-card ${isCurrent ? 'active' : ''}" data-song-id="${escapeHtml(song.id)}">
                <div class="card-img-wrapper"><img src="${escapeHtml(cover)}" alt="" loading="lazy"></div>
                <button class="del-btn" data-action="delete" aria-label="Excluir" title="Excluir música">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                </button>
                <button class="fav-btn ${isFav ? 'active' : ''}" data-action="fav" aria-label="${isFav ? 'Remover' : 'Favoritar'}">
                    ${isFav ? '❤️' : '🤍'}
                </button>
                <div class="card-title">${escapeHtml(song.title)}</div>
                <div class="card-artist">${escapeHtml(song.artist || 'Desconhecido')}</div>
            </div>
        `;
    }).join('');
    gridEl.querySelectorAll('.music-card').forEach(attachTilt);
}
function attachTilt(card) {
    card.addEventListener('mousemove', (e) => {
        if (window.matchMedia('(max-width:768px)').matches) return;
        const rect = card.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;
        card.style.transform = `perspective(900px) rotateX(${-y*6}deg) rotateY(${x*6}deg) translateY(-3px) scale(1.04)`;
    });
    card.addEventListener('mouseleave', () => { card.style.transform = ''; });
}
function setupGridDelegation(gridEl) {
    gridEl.addEventListener('click', (e) => {
        const card = e.target.closest('.music-card');
        if (!card) return;
        const songId = card.dataset.songId;
        if (!songId) return;
        const actionEl = e.target.closest('[data-action]');
        if (actionEl?.dataset.action === 'fav') { e.stopPropagation(); toggleFavorite(songId); return; }
        if (actionEl?.dataset.action === 'delete') { e.stopPropagation(); deleteMusic(songId); return; }
        playSong(songId);
    });
}
function updateActiveCard() {
    document.querySelectorAll('.music-card').forEach(card => {
        card.classList.toggle('active', card.dataset.songId === currentId);
    });
}
async function playSong(songId) {
    const idx = allSongs.findIndex(s => s.id === songId);
    if (idx < 0) return;
    if (ttsPlaying) stopTTS();
    currentId = songId;
    const song = allSongs[idx];
    let audioUrl = song.url;
    if (!audioUrl && song.local) {
        try {
            const blob = await dbGet('music', song.id);
            if (blob) audioUrl = URL.createObjectURL(blob);
        } catch (e) { console.error(e); }
    }
    if (!audioUrl) { toast('Arquivo não encontrado.', 'error'); return; }
    if (currentBlobURL) URL.revokeObjectURL(currentBlobURL);
    currentBlobURL = song.local ? audioUrl : null;
    setupAudioAnalysis();
    audio.src = audioUrl;
    audio.play().catch(e => {
        console.error(e);
        if (e.name === 'NotAllowedError') toast('Clique em Play para iniciar.', 'error');
        else toast('Erro ao reproduzir.', 'error');
    });
    $('npTitle').textContent = song.title;
    $('npArtist').textContent = song.artist || 'Desconhecido';
    const coverUrl = song.cover || 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400&h=400&fit=crop';
    if (song.cover) {
        $('npImg').src = song.cover;
        $('npImg').style.display = 'block';
        $('npIcon').style.display = 'none';
    } else {
        $('npImg').style.display = 'none';
        $('npIcon').style.display = 'flex';
    }
    $('expandedImg').src = coverUrl;
    $('expandedBg').style.backgroundImage = `url('${coverUrl}')`;
    $('expandedTitle').textContent = song.title;
    $('expandedArtist').textContent = song.artist || 'Desconhecido';
    updatePlayUI(true);
    updateActiveCard();
    $('visualizer').classList.add('playing');
    $('npCover').classList.add('playing');
    $('expandedArt').classList.add('playing');
    updateMediaSession(song);
    addToRecent(song);
    if (sleepMode === 'end') { sleepMode = 'off'; updateSleepUI(); }
}
function addToRecent(song) {
    recentTracks = recentTracks.filter(r => r.id !== song.id);
    recentTracks.unshift({ id: song.id, title: song.title, artist: song.artist, cover: song.cover });
    recentTracks = recentTracks.slice(0, 8);
    localStorage.setItem('dauplay_recent', JSON.stringify(recentTracks));
}
function updateMediaSession(song) {
    if (!('mediaSession' in navigator)) return;
    try {
        navigator.mediaSession.metadata = new MediaMetadata({
            title: song.title,
            artist: song.artist || 'Desconhecido',
            album: 'Dauplay',
            artwork: [{ src: song.cover || '', sizes: '512x512', type: 'image/jpeg' }]
        });
    } catch {}
}

/* ============================================================
   EXCLUIR MÚSICA — FUNÇÃO PRINCIPAL
============================================================ */
async function deleteMusic(songId) {
    const song = allSongs.find(s => s.id === songId);
    if (!song) { toast('Música não encontrada', 'error'); return; }

    const ok = confirm(`Excluir "${song.title}"?\n\nEssa ação não pode ser desfeita.`);
    if (!ok) return;

    // 1) Remove do IndexedDB (se for local)
    if (song.local) {
        try { await dbDelete('music', songId); }
        catch (e) { console.warn('Erro ao remover do IndexedDB:', e); }
    }

    // 2) Remove do array em memória
    allSongs = allSongs.filter(s => s.id !== songId);

    // 3) Remove das favoritas
    favorites.delete(songId);
    persistFavs();

    // 4) Persiste lista
    persistSongs();

    // 5) Se era a música atual, para e limpa o player
    if (currentId === songId) {
        stopPlayback();
        currentId = null;
        $('npTitle').textContent = 'Nada tocando';
        $('npArtist').textContent = 'Selecione uma música';
        $('npImg').style.display = 'none';
        $('npIcon').style.display = 'flex';
        if (currentBlobURL) { URL.revokeObjectURL(currentBlobURL); currentBlobURL = null; }
        audio.src = '';
        $('progressFill').style.width = '0%';
        $('currentTime').textContent = '0:00';
        $('totalTime').textContent = '0:00';
        $('expandedBarFill').style.width = '0%';
        $('expandedCurrent').textContent = '0:00';
        $('expandedTotal').textContent = '0:00';
    }

    // 6) Re-renderiza
    renderSongs();
    toast(`"${song.title}" excluída!`, 'success');
}

function toggleFavorite(songId) {
    if (favorites.has(songId)) { favorites.delete(songId); toast('Removida das favoritas'); }
    else { favorites.add(songId); toast('Adicionada às favoritas ❤️', 'success'); }
    persistFavs();
    renderSongs();
}
async function handleMusicUpload(event) {
    const files = Array.from(event.target.files);
    if (!files.length) return;
    toast(`Enviando ${files.length} música(s)...`);
    let success = 0, fail = 0;
    for (const file of files) {
        const id = 'local_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
        const song = { id, title: file.name.replace(/\.[^/.]+$/, ''), artist: 'Minha Biblioteca', local: true, cover: null };
        try { await dbPut('music', id, file); allSongs.push(song); success++; }
        catch (e) { console.error(e); fail++; }
    }
    persistSongs();
    renderSongs();
    if (success > 0 && fail === 0) toast(`${success} música(s) adicionada(s)!`, 'success');
    else if (success > 0) toast(`${success} adicionada(s), ${fail} falhou(aram).`);
    else toast(`Falha ao adicionar ${fail} música(s).`, 'error');
    event.target.value = '';
}

function togglePlay() {
    if (!audio.currentSrc && !audio.src) { if (allSongs.length) playSong(allSongs[0].id); return; }
    if (audio.paused) {
        audio.play().then(() => {
            updatePlayUI(true);
            $('visualizer').classList.add('playing');
            $('npCover').classList.add('playing');
            $('expandedArt').classList.add('playing');
            if (!vizRAF) startVisualizer();
        }).catch(() => toast('Erro ao reproduzir', 'error'));
    } else audio.pause();
}
function updatePlayUI(isPlaying) {
    const btns = [$('playBtn'), $('expandedPlayBtn')];
    const icons = [$('playIcon'), $('expandedPlayIcon')];
    btns.forEach(btn => {

function setupProgressBar() {
    const bar = $('progressBar');
    let dragging = false;
    function seek(e) {
        if (!audio.duration || !isFinite(audio.duration)) return;
        const rect = bar.getBoundingClientRect();
        const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        audio.currentTime = pct * audio.duration;
    }
    bar.addEventListener('pointerdown', (e) => {
        dragging = true;
        try { bar.setPointerCapture(e.pointerId); } catch {}
        seek(e);
    });
    bar.addEventListener('pointermove', (e) => { if (dragging) seek(e); });
    bar.addEventListener('pointerup', (e) => {
        dragging = false;
        try { bar.releasePointerCapture(e.pointerId); } catch {}
    });
    bar.addEventListener('keydown', (e) => {
        if (!audio.duration) return;
        if (e.key === 'ArrowRight') { audio.currentTime = Math.min(audio.duration, audio.currentTime + 5); e.preventDefault(); }
        else if (e.key === 'ArrowLeft') { audio.currentTime = Math.max(0, audio.currentTime - 5); e.preventDefault(); }
        else if (e.key === 'Home') { audio.currentTime = 0; e.preventDefault(); }
        else if (e.key === 'End') { audio.currentTime = audio.duration; e.preventDefault(); }
    });
    const expBar = $('expandedBarWrap');
    if (expBar) {
        expBar.addEventListener('click', (e) => {

            const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
            audio.currentTime = pct * audio.duration;
        });
    }
